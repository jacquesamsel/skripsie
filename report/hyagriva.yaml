ignlinski2017autonomous-vehicles-ghg:
  type: article
  title: Analysis of the Potential of Autonomous Vehicles in Reducing the Emissions of Greenhouse Gases in Road Transport
  author:
    - Igliński, Hubert
    - Babiak, Maciej
  date: 2017
  page-range: 353-358
  url: https://www.sciencedirect.com/science/article/pii/S1877705817326073
  serial-number:
    doi: https://doi.org/10.1016/j.proeng.2017.06.061
    issn: 1877-7058
  note: 12th international scientific conference of young scientists on sustainable, modern and safe transport
  abstract: Continuous and dynamic growth in demand for road transport, especially in developing countries, causes increase of greenhouse gases (GHG) emissions. At the same time the emissions of toxic components of exhaust gases harmful to human health and the environment enhance – particulate matter, nitrogen oxides, carbon monoxide and others. In particular, GHG emission and increase their concentration in the atmosphere, where road transport is the largest issuer in the transport sector, become one of the most important global problems. So far actions towards reducing energy consumption and emissions have not caused a decrease in global emissions. One of the key reasons for this is the presence of Jevons paradox, where the combined demand for transport grew faster than underwent the efficiency improvement of energy consumption and emissions reduction. One of the main reason for this is that vehicles offered on the market (especially cars) are characterized by an increase in weight and engine power. Broad implementation of autonomous vehicle (AV) can be a turning point in terms of reducing emissions of GHG. The aim of authors of this paper is to analyze the potential for AV to reduce GHG emissions from road transport. The analysis includes not only technical and technological issues, but also organizational and in the management of transport demand.
  parent:
    type: periodical
    title: Procedia Engineering
    volume: 192

